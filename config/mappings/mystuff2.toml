# MyStuff2 Pro CSV export -> bookshelf.
# Export settings: header row ON, comma delimiter, double-quote text delimiter, "|" multi-value
# delimiter. Column names are your category's attribute names; a column missing from a file is
# treated as empty, so one mapping serves every category with these attributes.

source = "mystuff2"
key_column = "item id"          # MyStuff2's stable per-item ID: what makes re-imports safe
multi_value_delimiter = "|"

[fields]                        # bookshelf field = column name in the export
title = "title"
authors = "author"              # several names joined by the multi-value delimiter
publisher = "publisher"
tags = "genre"                  # several genres -> several tags
pages = "pages"
edition = "edition"
condition = "quality"
estimated_value = "price"       # market value, stored privately
isbn = "item barcode"
volume = "volume"               # manga and other numbered volumes; use your column's exact name
# series = "series"             # only if a category has its own series column
# line = "line"                 # only if a category has its own product-line column
# A volume without a series puts the book in a series named after its title, so "Happiness"
# with volume 3 becomes vol. 3 of the series "Happiness". Categories without these columns are fine.
# Not mapped (kept in the stored raw row): item container, item bundles, item images,
# item attachments, item colors, item created, item updated.

[title_rules]
line_separator = ";"            # "DND 3.5; Monster Manual" -> product line "DND 3.5", title "Monster Manual"
extract_copies = true           # "(2 Copies)" -> copies = 2
extract_format = true           # "(Hardcover)", "Box Set" -> format
extract_edition = true          # "(Edition 2)" -> edition 2nd, when the edition cell is empty
extract_isbn = true             # "(0786931345)" -> ISBN, when the barcode cell is empty
extract_by_author = true        # "… by Rudy Rucker" -> cut; becomes the author if that cell is
                                # empty. "Illustrated by"/"Translated by"/"Edited by" set the role.
                                # Anything unclear stays in the title and goes on the review list.
extract_volume = true           # "Prophet Volume 1: Remission" -> series "Prophet", vol. 1,
                                # title "Remission"; only when there's no volume column/value

# Always on, no setting:
# - A year in the edition cell becomes the year: "1st; 1973" -> edition 1st, year 1973.
# - A year (and city) after the publisher too: "MacMillan, New York, 1968" -> MacMillan, 1968.
# - In the author cell, "(ed.)", "(trans.)" or "(ill.)" after a name sets the role:
#   "Fray Baroque (ed.)|Tegan Eanelli (ed.)".

# Your MyStuff2 condition words -> the conditions table. Keys are matched after normalisation
# (case, punctuation and spacing ignored). An unknown word is imported as no condition and
# added to the review list.
[condition_values]
"mint" = "mint"
"new" = "mint"
"like new" = "like_new"
"ex" = "excellent"
"excellent" = "excellent"
"vg" = "very_good"
"very good" = "very_good"
"good" = "good"
"fair" = "fair"
"poor" = "poor"

# Spelling variants of one publisher -> the name to store. Matched after normalisation.
[publisher_aliases]
"Chaosium Inc." = "Chaosium"
"Catalyst" = "Catalyst Game Labs"
"image" = "Image Comics"
"McGraw-Hill Companies" = "McGraw-Hill"
"University Of Illinois Press" = "University of Illinois Press"
